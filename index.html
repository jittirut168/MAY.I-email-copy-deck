<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAY.I — Email Notification Copy Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --panel:#FFFFFF; --ink:#1F2419; --muted:#626A5A; --line:#DDE2D6;
  --green:#6E9134; --green-soft:#EAF1DC; --pink:#C2389A; --pink-soft:#FBE6F4;
  --mail-bg:#FFFFFF; --mail-ink:#1F2419;
  --font:"Be Vietnam Pro","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161A12;--panel:#1F241A;--ink:#EEF1E8;--muted:#A6AE9C;--line:#343B2C;--green:#9DC25A;--green-soft:#2A3520;--pink:#EE7CCB;--pink-soft:#3A2333;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:inherit}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 12px}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.filters{padding:0 20px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;padding:6px 4px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
select{font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.list{overflow:auto;padding:4px 12px 24px;flex:1}
.group{margin:14px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:9px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--green-soft)}
.item .code{font-weight:700;font-size:13px;min-width:34px}
.item .name{flex:1;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.new{background:var(--pink);color:#fff}
.tag.upd{border:1px solid var(--green);color:var(--green)}
.empty{color:var(--muted);font-size:13px;padding:12px}
/* main */
.main{overflow:auto;min-height:0}
.wrap{max-width:1120px;margin:0 auto;padding:28px 32px 64px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head h2{margin:0;font-size:26px;letter-spacing:-.015em}
.who{font-size:13px;color:var(--muted)}
.trigger{grid-column:1/-1;margin:-8px 0 0;color:var(--muted);max-width:72ch}
/* inbox + email */
.inbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;flex:none}
.inbox .from{font-weight:600;font-size:14px}
.inbox .subj{font-weight:600}
.inbox .pre{color:var(--muted);font-size:14px}
.mail{background:var(--mail-bg);color:var(--mail-ink);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.mail .top{background:#fff;padding:20px 28px 8px}
.mail .body{padding:28px 28px 8px}
.mail h3{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
.mail p{margin:0 0 14px;max-width:62ch}
.cta{display:block;width:100%;text-align:center;background:#1F2419;color:#fff;font-weight:600;padding:14px;border-radius:12px;margin:8px 0 24px;text-decoration:none}
.mail .foot{border-top:1px solid #E6E9E1;padding:20px 28px 24px;color:#1F2419;font-size:13px}
.mail .foot p{margin:0 0 6px}
.ph{background:#EAF1DC;color:#4E6A1F;border-radius:5px;padding:0 4px;font-weight:500;white-space:nowrap}
mark.chg{background:var(--pink-soft);color:inherit;border-radius:4px;padding:0 2px}
.mail mark.chg{background:#FBE6F4}
/* spec */
.spec{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h4{margin:0 0 10px;font-size:14px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{font-size:13.5px;color:var(--muted);margin:0}
.toggle{display:flex;gap:6px;margin-bottom:12px}
.toggle button{border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
@media (max-width:960px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:44vh}
  .wrap{grid-template-columns:1fr;padding:20px 16px 48px}
  .spec{position:static}
}

/* phase deck */
.phases{padding:0 20px 12px}
.seg.big button{font-size:14px;padding:8px 4px}
.seg button[hidden]{display:none}
.item.ov{font-weight:600;margin-bottom:2px}
.item.disabled{opacity:.55}
.item.disabled .name{text-decoration:line-through}
.tag.rem{background:var(--bg);border:1px solid var(--muted);color:var(--muted)}
.muted{color:var(--muted)}
.notice{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:14px 18px;margin:0}
.notice h4{margin:0 0 6px;font-size:14px}
.notice p{margin:0;font-size:14px;color:var(--muted);max-width:80ch}
.notice button{margin-top:10px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.mail.off{opacity:.5;filter:grayscale(1)}
.ovwrap{max-width:1000px;margin:0 auto;padding:28px 32px 64px}
.ovwrap h2{margin:0 0 6px;font-size:26px;letter-spacing:-.015em}
.ovwrap .sub{color:var(--muted);margin:0 0 18px;max-width:75ch;font-size:14px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.sum span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
table.ov{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
table.ov th{text-align:left;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
table.ov td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ov tr.grp td{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted)}
table.ov tr.dis td{opacity:.6}
table.ov tr.dis td.nm{text-decoration:line-through}
table.ov .cell{border:0;background:transparent;font:inherit;cursor:pointer;padding:2px 0;color:inherit}
table.ov .cell:hover{text-decoration:underline}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>MAY.I email copy deck</h1>
      <p>Phase 1 · Phase 2 (payment gateway)</p>
    </div>
    <div class="phases">
      <div class="seg big" id="phase" role="group" aria-label="Phase">
        <button data-ph="1" aria-pressed="false">Phase 1</button>
        <button data-ph="2" aria-pressed="true">Phase 2</button>
      </div>
    </div>
    <div class="filters">
      <div class="seg" id="stseg" role="group" aria-label="Change status">
        <button data-st="all" aria-pressed="true">All</button>
        <button data-st="new" aria-pressed="false">New</button>
        <button data-st="upd" aria-pressed="false">Updated</button>
        <button data-st="rem" aria-pressed="false">Removed</button>
      </div>
      <select id="who" aria-label="Recipient">
        <option value="all">Everyone</option>
        <option value="Token member">Token member</option>
        <option value="Subscriber">Subscriber</option>
      </select>
      <div class="legend"><span class="tag new">New</span><span class="tag upd">Updated</span><span class="tag rem">Removed</span><span>Changed words are highlighted</span></div>
    </div>
    <nav class="list" id="list" aria-label="Emails"></nav>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

 subject:"Return your overdue items by tomorrow",pre:"Your account will be suspended if they aren’t returned",headline:"Last day to return your items",
 body:"Hi {{user_name}}, some of your borrowed items are 29 days overdue. If they aren’t returned by {{suspend_date}}, your account will be suspended and you won’t be able to borrow again. Late fees are 20 THB per day until they’re back.",cta:"Return now"},
{id:"E3",g:"E",name:"Account suspended",st:"new",who:"Both",when:"Items not returned within 30 days of the due date.",
 subject:"Your MAY.I account has been suspended",pre:"You can still return your items",headline:"Your account is suspended",

];
const PREF=e=>e.g==="A"?"Return due reminders · can turn off":e.g==="B"?"Token updates · can turn off":e.g==="C"?"Membership · can turn off":"Always sent (not in Notification settings)";

const SCREEN2={"Renew membership":"S2-r · Renew membership (PromptPay)","Manage membership":"S5 · Membership (auto-renew)","Renew now":"S2-rF · Renew membership (after a failed charge)","View billing history":"$1 · Billing history"};
const screenOf=(cta,p)=>(p===2&&SCREEN2[cta])||SCREEN[cta]||"—";
// ---- Phase 2 changes (compared with Phase 1)
const P2={
 C1:{removed:true,why:"In Phase 1 this was sent after an admin approved the slip. In Phase 2 the payment is confirmed on screen (S4) and recorded in Billing history, so by the “no email when the result is already on screen” rule it is no longer sent. The in-app notification “Your membership is active” is removed too."},
 C2:{upd:true,chg:["pre","body"],whoNote:"PromptPay",ov:{when:"3 days before membership ends. PromptPay members only — card members renew automatically (see C6).",pre:"Renew now to keep borrowing without tokens",body:"Hi {{user_name}}, your {{plan_name}} membership ends on {{valid_until}}. Renew now so it doesn’t lapse."},why:"Payments are confirmed instantly now, so the “approval takes up to 2 business days” line is removed. Sent to PromptPay members only."},
 C3:{upd:true,chg:[],whoNote:"PromptPay",ov:{when:"1 day before membership ends. PromptPay members only."},why:"Copy unchanged. Recipients narrowed to PromptPay members because card members renew automatically."},
 C4:{upd:true,chg:[],whoNote:"all end reasons",ov:{when:"On the end date: a PromptPay membership lapsed, a cancelled subscription reached the end of its period, or card renewal failed on every retry."},why:"Copy unchanged — one email for every end reason (same as the single in-app notification)."},
 C5:{upd:true,chg:["body","cta"],whoNote:"Card",ov:{when:"A card renewal succeeded automatically (the user is not on screen). PromptPay renewals are confirmed on screen (S5-r) and don’t send this.",body:"Hi {{user_name}}, your {{plan_name}} membership has been renewed with {{payment_method}} and is now valid until {{valid_until}}. You can request a receipt or tax invoice within 7 days in Billing history.",cta:"View billing history"},why:"Adds the payment method and the 7-day window for requesting a receipt or tax invoice; the CTA now opens Billing history. Card auto-renewals only."}
};
const NEW2=[
 {id:"C6",g:"C",only:2,name:"Will renew soon",st:"new",who:"Subscriber",whoNote:"Card",when:"3 days before the automatic card charge.",
  subject:"Your membership renews in 3 days",pre:"We’ll charge your card on {{renewal_date}}",headline:"Renewing soon",
  body:"Hi {{user_name}}, your {{plan_name}} membership will renew automatically on {{renewal_date}}. We’ll charge {{amount}} to {{payment_method}}. You can cancel anytime before then in Membership.",cta:"Manage membership",
  why2:"New in Phase 2. Card members are charged automatically, so they get a heads-up before the money is taken (the membership fee isn’t refundable). Can be turned off in Notification settings (Membership)."},
 {id:"E4",g:"E",only:2,name:"Couldn’t renew",st:"new",who:"Subscriber",whoNote:"Card",when:"Every time a card renewal charge fails (requirement E2). The user can’t borrow new items until it goes through; items already borrowed are due on the same dates.",
  subject:"We couldn’t renew your membership",pre:"Renew now to keep borrowing",headline:"Your payment didn’t go through",
  body:"Hi {{user_name}}, we couldn’t charge your card for your {{plan_name}} membership renewal. We’ll try again, or you can renew now with another card. Until it goes through you can’t borrow new items, and items you have are still due on the same dates.",cta:"Renew now",
  why2:"New in Phase 2. Always sent (Account alerts) because it blocks borrowing, so it can’t be turned off."}
];
E.splice(E.findIndex(x=>x.id==="C5")+1,0,NEW2[0]);
E.splice(E.findIndex(x=>x.id==="E3")+1,0,NEW2[1]);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph=s=>esc(s).replace(/\{\{(\w+)\}\}/g,'<span class="ph">{{$1}}</span>');
let state={phase:2,st:"all",who:"all",id:"overview",vp:2,ver:"after"};
const exists=(e,p)=>!(e.only===2&&p===1);
const tagFor=(e,p)=>{if(!exists(e,p))return null;if(p===1)return e.st==="new"?"new":e.st==="upd"?"upd":null;if(e.only===2)return"new";const x=P2[e.id];if(x&&x.removed)return"rem";if(x&&(x.upd||x.ov))return"upd";return null};
const tagHtml=t=>t==="new"?'<span class="tag new">New</span>':t==="upd"?'<span class="tag upd">Updated</span>':t==="rem"?'<span class="tag rem">Removed</span>':"";
const whoLabel=(e,p)=>{const x=P2[e.id]||{};const n=p===2?(x.whoNote||e.whoNote):"";return e.who+(n?" · "+n:"")};
const match=e=>(state.st==="all"||tagFor(e,state.phase)===state.st)&&(state.who==="all"||e.who===state.who||e.who==="Both");
function setHash(){const h=state.id==="overview"?"overview":"p"+state.vp+"/"+state.id;if(location.hash.slice(1)!==h)location.hash=h}
function parseHash(){const h=location.hash.slice(1);if(!h||h==="overview"){state.id="overview";return}
  const m=h.match(/^p([12])\/(.+)$/);if(m&&E.find(e=>e.id===m[2])){state.phase=+m[1];state.vp=+m[1];state.id=m[2]}
  else if(E.find(e=>e.id===h)){state.id=h;state.vp=state.phase}else state.id="overview"}
function syncControls(){document.querySelectorAll("#phase button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.ph===state.phase)));
  const rem=document.querySelector('#stseg button[data-st="rem"]');rem.hidden=state.phase===1;if(state.phase===1&&state.st==="rem")state.st="all";
  document.querySelectorAll("#stseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.st===state.st)))}
function renderList(){
  const L=document.getElementById("list");let h=`<button class="item ov" data-id="overview" aria-current="${state.id==="overview"}"><span class="name">Overview · Phase 1 ↔ Phase 2</span></button>`;let any=false;
  for(const g of Object.keys(GROUPS)){let items=E.filter(e=>e.g===g&&exists(e,state.phase)&&match(e));if(!items.length)continue;any=true;
    if(state.phase===2)items=[...items.filter(e=>tagFor(e,2)!=="rem"),...items.filter(e=>tagFor(e,2)==="rem")];
    h+=`<div class="group">${g} · ${GROUPS[g]}</div>`;
    for(const e of items){const t=tagFor(e,state.phase);h+=`<button class="item${t==="rem"?" disabled":""}" data-id="${e.id}" aria-current="${e.id===state.id}"${t==="rem"?' aria-disabled="true"':""}><span class="code">${e.id}</span><span class="name">${e.name}</span>${tagHtml(t)}</button>`}}
  L.innerHTML=h+(any?"":'<div class="empty">No emails match these filters.</div>');
  L.querySelectorAll(".item").forEach(b=>b.onclick=()=>{state.id=b.dataset.id;state.vp=state.phase;state.ver="after";setHash();render()});
}
function renderOverview(){
  const V=document.getElementById("view");let rows="";const cnt={new:0,upd:0,rem:0};
  for(const e of E){const t=tagFor(e,2);if(t)cnt[t]++}
  for(const g of Object.keys(GROUPS)){const it=E.filter(e=>e.g===g);const order=[...it.filter(e=>tagFor(e,2)!=="rem"),...it.filter(e=>tagFor(e,2)==="rem")];
    rows+=`<tr class="grp"><td colspan="5">${g} · ${GROUPS[g]}</td></tr>`;
    for(const e of order){const t1=tagFor(e,1),t2=tagFor(e,2);const dis=t2==="rem";
      const c1=exists(e,1)?(t1?tagHtml(t1):'<span class="muted">same</span>'):'<span class="muted">not in Phase 1</span>';
      const c2=t2?tagHtml(t2):'<span class="muted">same</span>';
      rows+=`<tr class="${dis?"dis":""}"><td><b>${e.id}</b></td><td class="nm">${e.name}</td><td>${esc(whoLabel(e,2))}</td><td>${exists(e,1)?`<button class="cell" data-id="${e.id}" data-p="1">${c1}</button>`:c1}</td><td><button class="cell" data-id="${e.id}" data-p="2">${c2}</button></td></tr>`}}
  V.innerHTML=`<div class="ovwrap" style="grid-column:1/-1"><h2>Overview</h2><p class="sub">Every email in both phases. The Phase 1 column compares with the app today; the Phase 2 column compares with Phase 1. Click a cell to open that email in that phase. Emails removed in Phase 2 sit at the bottom of their group.</p>
  <div class="sum"><span><b>${cnt.new}</b> new in Phase 2</span><span><b>${cnt.upd}</b> updated</span><span><b>${cnt.rem}</b> removed</span></div>
  <table class="ov"><thead><tr><th>Code</th><th>Email</th><th>For</th><th>Phase 1</th><th>Phase 2</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="legend2"><span class="tag new">New</span><span class="tag upd">Updated</span><span class="tag rem">Removed</span><span>“same” = no change in that phase</span></div></div>`;
  V.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{state.id=b.dataset.id;state.phase=+b.dataset.p;state.vp=+b.dataset.p;state.ver="after";setHash();render()});
}
function renderView(){
  if(state.id==="overview")return renderOverview();
  const e=E.find(x=>x.id===state.id)||E[0];const V=document.getElementById("view");const p=state.vp;const x=P2[e.id]||{};
  const t=tagFor(e,p);
  const phTabs=`<div class="toggle" role="group" aria-label="Phase">${[1,2].map(n=>`<button data-p="${n}" aria-pressed="${p===n}">Phase ${n}</button>`).join("")}</div>`;
  const wire=()=>{V.querySelectorAll(".toggle button[data-p]").forEach(b=>b.onclick=()=>{state.vp=+b.dataset.p;state.ver="after";setHash();renderView()});V.querySelectorAll(".toggle button[data-v]").forEach(b=>b.onclick=()=>{state.ver=b.dataset.v;renderView()});V.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.vp=+b.dataset.go;setHash();renderView()})};
  if(!exists(e,p)){
    V.innerHTML=`<div class="head"><h2>${e.id} · ${e.name}</h2><span class="tag new">New in Phase 2</span><span class="who">For: ${esc(whoLabel(e,2))}</span></div>
    <div class="notice" style="margin-top:8px">${phTabs}<h4>This email doesn’t exist in Phase 1</h4><p>It is added in Phase 2. ${esc(e.why2||"")}</p><button data-go="2">View in Phase 2</button></div>`;wire();return}
  const removed=p===2&&x.removed;
  const c=(p===2&&x.ov)?{...e,...x.ov}:e;
  const hl=removed?[]:(p===1?(e.chg||[]):(p===2?(x.chg||[]):[]));
  const useOld=p===1&&state.ver==="before"&&e.old;
  const field=k=>{const v=useOld&&e.old[k]!==undefined?e.old[k]:c[k];let o=ph(v);if(!useOld&&hl.includes(k))o=`<mark class="chg">${o}</mark>`;return o};
  const ctaKey=useOld&&e.old&&e.old.cta?e.old.cta:c.cta;
  const ctaHtml=(!useOld&&hl.includes("cta"))?`<mark class="chg" style="background:transparent;color:#fff;text-decoration:underline">${esc(ctaKey)}</mark>`:esc(ctaKey);
  const why=removed?x.why:(p===2?(e.only===2?e.why2:x.why):e.why);
  const chgNote=removed?"":(p===2?(e.only===2?"":(x.chg&&x.chg.length?" Changed fields: "+x.chg.join(", ")+".":" No copy changes.")):(e.chg?" Changed fields: "+e.chg.join(", ")+".":""));
  V.innerHTML=`
  <div class="head"><h2>${e.id} · ${e.name}</h2>${removed?'<span class="tag rem">Removed in Phase 2</span>':tagHtml(t)}<span class="who">For: ${esc(whoLabel(e,p))}</span></div>
  <p class="trigger">${removed?"Phase 1 sent this when: ":"Sent when: "}${esc(c.when)}</p>
  ${removed?`<div class="notice"><h4>Removed in Phase 2 — no longer sent</h4><p>${esc(x.why)}</p></div>`:""}
  <section aria-label="Email preview">
    ${phTabs}
    ${p===1&&e.old?`<div class="toggle" role="group" aria-label="Version"><button data-v="after" aria-pressed="${state.ver==="after"}">Phase 1 copy</button><button data-v="before" aria-pressed="${state.ver==="before"}">Copy in the app today</button></div>`:""}
    <div class="inbox"><div class="avatar">M</div><div><div class="from">MAY.I</div><div class="subj">${field("subject")}</div><div class="pre">${field("pre")}</div></div></div>
    <article class="mail${removed?" off":""}">
      <div class="top">${LOGO}</div>
      <div class="body"><h3>${field("headline")}</h3><p>${field("body")}</p>
        <a class="cta" href="#${e.id}" onclick="return false">${ctaHtml}</a></div>
      <div class="foot"><div style="margin-bottom:14px">${LOGO}</div><p style="margin:0">This email was sent regarding your MAY.I account activity.</p><p><a href="#" onclick="return false" style="color:inherit">Contact support</a></p><p style="margin-top:12px">Punpromotion Co., Ltd. · 196, 196/1-2 Pradipat Road, Phaya Thai, Bangkok 10400</p><p style="margin-top:12px">© 2026 MAY.I. All rights reserved.</p></div>
    </article>
  </section>
  <aside class="spec">
    <div class="card"><h4>Copy fields · Phase ${p}</h4><dl class="kv">
      <dt>Subject</dt><dd>${ph(c.subject)}</dd><dt>Preheader</dt><dd>${ph(c.pre)}</dd><dt>Headline</dt><dd>${ph(c.headline)}</dd><dt>CTA</dt><dd>${esc(c.cta)}</dd><dt>Opens</dt><dd>${esc(screenOf(c.cta,p))}</dd><dt>Setting</dt><dd>${PREF(e)}</dd></dl></div>
    ${why?`<div class="card"><h4>${removed?"Why removed":"What changed"}</h4><p class="note">${esc(why)}${chgNote}</p></div>`:""}
    <div class="card"><h4>Placeholders</h4><p class="note">${[...new Set((c.subject+c.pre+c.headline+c.body).match(/\{\{\w+\}\}/g)||[])].map(q=>`<span class="ph">${q}</span>`).join(" ")||"None"}</p></div>
  </aside>`;
  wire();
}
function render(){syncControls();renderList();renderView()}
document.querySelectorAll("#phase button").forEach(b=>b.onclick=()=>{state.phase=+b.dataset.ph;state.vp=state.phase;state.ver="after";setHash();render()});
document.querySelectorAll("#stseg button").forEach(b=>b.onclick=()=>{state.st=b.dataset.st;render()});
document.getElementById("who").onchange=ev=>{state.who=ev.target.value;render()};
window.addEventListener("hashchange",()=>{parseHash();render()});
parseHash();render();
</script>
</body>
</html>
