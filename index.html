<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAY.I — Email Notification Copy Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --panel:#FFFFFF; --ink:#1F2419; --muted:#626A5A; --line:#DDE2D6;
  --green:#6E9134; --green-soft:#EAF1DC; --pink:#C2389A; --pink-soft:#FBE6F4;
  --mail-bg:#FFFFFF; --mail-ink:#1F2419;
  --font:"Be Vietnam Pro","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161A12;--panel:#1F241A;--ink:#EEF1E8;--muted:#A6AE9C;--line:#343B2C;--green:#9DC25A;--green-soft:#2A3520;--pink:#EE7CCB;--pink-soft:#3A2333;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:inherit}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 12px}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.filters{padding:0 20px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;padding:6px 4px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
select{font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.list{overflow:auto;padding:4px 12px 24px;flex:1}
.group{margin:14px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:9px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--green-soft)}
.item .code{font-weight:700;font-size:13px;min-width:34px}
.item .name{flex:1;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.new{background:var(--pink);color:#fff}
.tag.upd{border:1px solid var(--green);color:var(--green)}
.empty{color:var(--muted);font-size:13px;padding:12px}
/* main */
.main{overflow:auto;min-height:0}
.wrap{max-width:1120px;margin:0 auto;padding:28px 32px 64px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head h2{margin:0;font-size:26px;letter-spacing:-.015em}
.who{font-size:13px;color:var(--muted)}
.trigger{grid-column:1/-1;margin:-8px 0 0;color:var(--muted);max-width:72ch}
/* inbox + email */
.inbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;flex:none}
.inbox .from{font-weight:600;font-size:14px}
.inbox .subj{font-weight:600}
.inbox .pre{color:var(--muted);font-size:14px}
.mail{background:var(--mail-bg);color:var(--mail-ink);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.mail .top{background:#fff;padding:20px 28px 8px}
.mail .body{padding:28px 28px 8px}
.mail h3{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
.mail p{margin:0 0 14px;max-width:62ch}
.cta{display:block;width:100%;text-align:center;background:#1F2419;color:#fff;font-weight:600;padding:14px;border-radius:12px;margin:8px 0 24px;text-decoration:none}
.mail .foot{border-top:1px solid #E6E9E1;padding:20px 28px 24px;color:#1F2419;font-size:13px}
.mail .foot p{margin:0 0 6px}
.ph{background:#EAF1DC;color:#4E6A1F;border-radius:5px;padding:0 4px;font-weight:500;white-space:nowrap}
mark.chg{background:var(--pink-soft);color:inherit;border-radius:4px;padding:0 2px}
.mail mark.chg{background:#FBE6F4}
/* spec */
.spec{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h4{margin:0 0 10px;font-size:14px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{font-size:13.5px;color:var(--muted);margin:0}
.toggle{display:flex;gap:6px;margin-bottom:12px}
.toggle button{border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
@media (max-width:960px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:44vh}
  .wrap{grid-template-columns:1fr;padding:20px 16px 48px}
  .spec{position:static}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>MAY.I email copy deck</h1>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Change status">
        <button data-st="all" aria-pressed="true">All</button>
        <button data-st="new" aria-pressed="false">New</button>
        <button data-st="upd" aria-pressed="false">Updated</button>
      </div>
      <select id="who" aria-label="Recipient">
        <option value="all">Everyone</option>
        <option value="Token member">Token member</option>
        <option value="Subscriber">Subscriber</option>
      </select>
      <div class="legend"><span class="tag new">New</span><span class="tag upd">Updated</span><span>Changed words are highlighted</span></div>
    </div>
    <nav class="list" id="list" aria-label="Emails"></nav>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

const PREF=e=>e.g==="A"?"Return due reminders · can turn off":e.g==="B"?"Token updates · can turn off":e.g==="C"?"Membership · can turn off":"Always sent (not in Notification settings)";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph=s=>esc(s).replace(/\{\{(\w+)\}\}/g,'<span class="ph">{{$1}}</span>');
let state={st:"all",who:"all",id:location.hash.slice(1)||"A1",ver:"after"};
const match=e=>(state.st==="all"||e.st===state.st)&&(state.who==="all"||e.who===state.who||e.who==="Both");
function renderList(){
  const L=document.getElementById("list");let h="";let any=false;
  for(const g of Object.keys(GROUPS)){const items=E.filter(e=>e.g===g&&match(e));if(!items.length)continue;any=true;
    h+=`<div class="group">${g} · ${GROUPS[g]}</div>`;
    for(const e of items)h+=`<button class="item" data-id="${e.id}" aria-current="${e.id===state.id}"><span class="code">${e.id}</span><span class="name">${e.name}</span>${e.st==="new"?'<span class="tag new">New</span>':e.st==="upd"?'<span class="tag upd">Updated</span>':""}</button>`}
  L.innerHTML=any?h:'<div class="empty">No emails match these filters.</div>';
  L.querySelectorAll(".item").forEach(b=>b.onclick=()=>{state.id=b.dataset.id;state.ver="after";location.hash=state.id;render()});
}
function field(e,k){const useOld=state.ver==="before"&&e.old&&e.old[k]!==undefined;const v=useOld?e.old[k]:e[k];let out=ph(v);
  if(state.ver==="after"&&e.chg&&e.chg.includes(k))out=`<mark class="chg">${out}</mark>`;return out}
function renderView(){
  const e=E.find(x=>x.id===state.id)||E[0];const V=document.getElementById("view");
  const tag=e.st==="new"?'<span class="tag new">New</span>':e.st==="upd"?'<span class="tag upd">Updated</span>':"";
  const ctaKey=state.ver==="before"&&e.old&&e.old.cta?e.old.cta:e.cta;
  V.innerHTML=`
  <div class="head"><h2>${e.id} · ${e.name}</h2>${tag}<span class="who">For: ${e.who}</span></div>
  <p class="trigger">Sent when: ${esc(e.when)}</p>
  <section aria-label="Email preview">
    ${e.old?`<div class="toggle" role="group" aria-label="Version"><button data-v="after" aria-pressed="${state.ver==="after"}">New copy</button><button data-v="before" aria-pressed="${state.ver==="before"}">Previous copy</button></div>`:""}
    <div class="inbox"><div class="avatar">M</div><div><div class="from">MAY.I</div><div class="subj">${field(e,"subject")}</div><div class="pre">${field(e,"pre")}</div></div></div>
    <article class="mail">
      <div class="top">${LOGO}</div>
      <div class="body"><h3>${field(e,"headline")}</h3><p>${field(e,"body")}</p>
        <a class="cta" href="#${e.id}" onclick="return false">${state.ver==="after"&&e.chg&&e.chg.includes("cta")?`<mark class="chg" style="background:transparent;color:#fff;text-decoration:underline">${esc(ctaKey)}</mark>`:esc(ctaKey)}</a></div>
      <div class="foot"><div style="margin-bottom:14px">${LOGO}</div><p style="margin:0">This email was sent regarding your MAY.I account activity.</p><p><a href="#" onclick="return false" style="color:inherit">Contact support</a></p><p style="margin-top:12px">Punpromotion Co., Ltd. · 196, 196/1-2 Pradipat Road, Phaya Thai, Bangkok 10400</p><p style="margin-top:12px">© 2026 MAY.I. All rights reserved.</p></div>
    </article>
  </section>
  <aside class="spec">
    <div class="card"><h4>Copy fields</h4><dl class="kv">
      <dt>Subject</dt><dd>${ph(e.subject)}</dd><dt>Preheader</dt><dd>${ph(e.pre)}</dd><dt>Headline</dt><dd>${ph(e.headline)}</dd><dt>CTA</dt><dd>${esc(e.cta)}</dd><dt>Opens</dt><dd>${esc(SCREEN[e.cta]||"—")}</dd><dt>Setting</dt><dd>${PREF(e)}</dd></dl></div>
    ${e.why?`<div class="card"><h4>What changed</h4><p class="note">${esc(e.why)} Changed fields: ${e.chg.join(", ")}.</p></div>`:""}
    <div class="card"><h4>Placeholders</h4><p class="note">${[...new Set((e.subject+e.pre+e.headline+e.body).match(/\{\{\w+\}\}/g)||[])].map(p=>`<span class="ph">${p}</span>`).join(" ")||"None"}</p></div>
  </aside>`;
  V.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{state.ver=b.dataset.v;renderView()});
}
function render(){renderList();renderView()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.st=b.dataset.st;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));const f=E.filter(match);if(f.length&&!f.find(e=>e.id===state.id)){state.id=f[0].id;location.hash=state.id}render()});
document.getElementById("who").onchange=ev=>{state.who=ev.target.value;const f=E.filter(match);if(f.length&&!f.find(e=>e.id===state.id)){state.id=f[0].id;location.hash=state.id}render()};
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(E.find(e=>e.id===id)&&id!==state.id){state.id=id;state.ver="after";render()}});
render();
</script>
